# set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_peach}"
# set -ogq "@catppuccin_${MODULE_NAME}_text" " #{l:#{pomodoro_status}}"
#
# set -agF status-right "#{E:@catppuccin_mypomo}"

run '~/.tmux/plugins/tpm/tpm'

